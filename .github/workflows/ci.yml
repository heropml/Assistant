name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 构建与验证
    # 执行器使用 macOS 26 SDK 中的 posix_spawn_file_actions_addchdir，需要 Xcode 26。
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: 工具链版本
        run: |
          xcodebuild -version
          swift --version

      - name: 构建、签名与核心测试
        run: ./Scripts/verify-local.sh

      - name: 打包 DMG 与更新清单
        run: |
          ./Scripts/package-update.sh "CI 验证"
          /usr/bin/jq -e '
            (.version | test("^[0-9]+(\\.[0-9]+)*$"))
            and (.url_mac | length == 1)
            and (.arch_mac == "arm64")
            and (.sha256_mac | test("^[0-9a-f]{64}$"))
            and (.size_mac > 0)
            and (.notes == "CI 验证")
          ' dist/latest.json
          cat dist/latest.json
